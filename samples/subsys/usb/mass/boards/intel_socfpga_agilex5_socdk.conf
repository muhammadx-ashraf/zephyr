CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Expose board eMMC/SD (disk-name "SD") over USB MSC.
# Do not use APP_MSC_STORAGE_SDCARD: that mounts FAT on the whole device,
# but the card has a partition table (p1 vfat / p2 ext4). Host sees partitions.
CONFIG_APP_MSC_STORAGE_NONE=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVER_RAM=n

CONFIG_SAMPLE_USBD_MANUFACTURER="Intel SoC FPGA"
CONFIG_SAMPLE_USBD_PRODUCT="Agilex5 USB MSC"
CONFIG_SAMPLE_USBD_SN="AGX5-001"
CONFIG_SAMPLE_USBD_PID=0x0008
CONFIG_APP_MSC_T10_VENDOR="Intel"
CONFIG_APP_MSC_T10_PRODUCT="Agilex5 eMMC"

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# ISR-path DBG floods the buffer and drops control-transfer traces
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
CONFIG_USBD_LOG_LEVEL_DBG=y
CONFIG_USBD_MSC_LOG_LEVEL_INF=y
